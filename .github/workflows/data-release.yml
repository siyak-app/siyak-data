name: data-release

on:
  push:
    tags: ["data-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag format
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^data-[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "tag must look like data-YYYY.MM.N, got $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Reproducible build time (commit time of the tag)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # The vectors group builds the model and vector packs (pack-format §4.6-4.7);
      # it has no torch, which only the evaluation (embed group) needs.
      - run: uv sync --locked --group vectors
      - run: uv run pytest
      # Model files (BGE-M3 is 2.3 GB) and the pinned verse vectors, by their pins.
      - uses: actions/cache@v6
        with:
          path: |
            .cache/model.*
            .cache/vectors.*
          key: embedding-inputs-${{ hashFiles('sources/models/*/source.toml', 'sources/vectors/*/source.toml') }}
          restore-keys: embedding-inputs-
      - run: uv run siyak-data fetch
      # Spec §6.6: ask Quranpedia's changes API (and the other upstreams) on every
      # release; the result goes into the release notes. Re-pinning stays manual.
      - name: Upstream changes since the pins
        run: uv run siyak-data check-updates | tee dist-check-updates.txt
      - run: uv run siyak-data build
      # Published model packs are quantized here; vector packs come from their pinned
      # vectors (no API key in CI), a local one checked against its model pack.
      - run: uv run siyak-data build-embeddings --published
      - run: uv run siyak-data validate
      - run: uv run siyak-data manifest --tag "$GITHUB_REF_NAME"
      - name: Checksums
        working-directory: dist
        run: sha256sum core.db ./*.sqlite.zst ./*.tar.zst manifest.json pricing.json > SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Data release $GITHUB_REF_NAME."
            echo
            echo "Upstream changes since the pins (check-updates):"
            echo '```'
            cat dist-check-updates.txt
            echo '```'
            echo
            echo "Validation report:"
            echo '```'
            cat dist/validation-report.txt
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --latest \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/core.db dist/*.sqlite.zst dist/*.tar.zst dist/manifest.json dist/pricing.json \
            dist/SHA256SUMS dist/validation-report.txt dist/reports/qac-alignment.md \
            dist/reports/tafsir-coverage.md dist/reports/tafsir-sizes.md

      # Ask the app repository to copy manifest.json and pricing.json to the
      # website (spec §6.3). Disabled until the token exists.
      # TODO: create a fine-grained personal access token with
      #   "Contents: read and write" on siyak-app/siyak only (repository_dispatch
      #   requires it), store it as the secret SIYAK_APP_DISPATCH_TOKEN in this
      #   repository, then set the repository variable DISPATCH_TO_APP=true.
      - name: Notify the app repository
        if: vars.DISPATCH_TO_APP == 'true'
        env:
          GH_TOKEN: ${{ secrets.SIYAK_APP_DISPATCH_TOKEN }}
        run: |
          gh api repos/siyak-app/siyak/dispatches \
            -f event_type=data-release \
            -F "client_payload[tag]=$GITHUB_REF_NAME"
