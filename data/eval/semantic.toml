# Evaluation set for semantic search and cross-references (app spec §7.4, §7.6, §18).
#
# Used by `siyak-data eval-embeddings` to compare embedding models and the text that is
# embedded for each verse. Verses are `surah:ayah`; `a:b-c` is a range.
#
# [[query]]    A search as a user would type it, in Turkish, English or Arabic, and the
#              verses a good result list should contain. Queries describe the meaning in
#              other words than the translations where possible, so that they test meaning
#              rather than shared words.
# [[related]]  A verse and verses elsewhere in the Quran on the same subject: what the
#              cross-reference panel should find. Verses within 5 of the starting verse in
#              the same surah are left out of the ranking (they are found by reading on), so
#              they are not listed.
#
# Drafted by the maintainers; each expected verse was checked against the Diyanet Vakfı
# translation (`tr.vakfi`). Corrections and additions are welcome (CONTRIBUTING.md).

