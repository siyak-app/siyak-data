[project]
name = "siyak-data"
version = "0.1.0"
description = "Build pipeline for Siyak's content packs (core.db, translations, tafsir, morphology)."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Kemal Özyön and Siyak contributors" }]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1,<0.29",
  "zstandard>=0.25.0,<0.26",
]

[project.scripts]
siyak-data = "pipeline.cli:main"

[dependency-groups]
dev = [
  "mypy>=2.4.0,<2.5",
  "pytest>=9.1.1,<9.2",
  "ruff>=0.17.1,<0.18",
]
# Building the model and vector packs (build-embeddings, export-vectors; the release).
vectors = [
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "tokenizers>=0.23.3",
]
# Also comparing candidate models (eval-embeddings).
embed = [
    { include-group = "vectors" },
    "sentence-transformers>=6.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# En dashes are used for code point ranges (U+064B–065F) in comments.
allowed-confusables = ["–"]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PTH"]
ignore = [
  "PLR2004", # magic numbers: counts like 114 and 6236 are the domain
  "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
# Tests and vectors contain Arabic text on purpose.
"tests/**" = ["PLR0915", "RUF001", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["pipeline"]

# The embedding modules import the optional `embed` group lazily; CI type-checks
# without it, and onnxruntime ships no type information.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "onnxruntime", "onnxruntime.*", "sentence_transformers", "tokenizers", "torch"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "full: needs the full pinned sources in .cache/ (skipped when absent)",
]
