# Yasser ad-Dussary: recitation audio from EveryAyah. See README.md in this directory.
# Upstream files are pinned in files.tsv (pipeline/build_audio.py).

[source]
id = "audio.dussary"
name = "EveryAyah recitation: Yasser ad-Dussary"
homepage = "https://everyayah.com"
license = "Copyright of the reciter and the recording's producer; no license stated by EveryAyah"
attribution = "Recitation: Yasser ad-Dussary (Murattal). Source: EveryAyah, https://everyayah.com"
notes = """
EveryAyah verse files (Yasser_Ad-Dussary_128kbps): one mp3 per verse. Quran.com has this
recitation only as surah files (chapter reciter 97) whose verse timings do not fit some
of the files, so the verse files are taken from EveryAyah instead of cutting the surahs.
Re-encoded to mono MP3 at 64 kbit/s, without tags. No license for redistribution was
found or granted; the project maintainer decided on 2026-11-07 to publish with
attribution and to remove the pack on the rights holder's request (app ADR 0014).
"""

[build]
everyayah = "Yasser_Ad-Dussary_128kbps"

[pack]
id = "audio.dussary"
type = "audio"
lang = "ar"
title = { tr = "Yasir ed-Devseri", en = "Yasser ad-Dussary" }
author = "Yasser ad-Dussary"
version = "1.0.0"
min_app_version = "0.1.0"
license = "Copyright of the reciter; redistributed from EveryAyah with attribution"
attribution = "Recitation: Yasser ad-Dussary (Murattal). Source: EveryAyah, https://everyayah.com"
publish = true

[pack.description]
tr = "Yasir ed-Devseri kıraatiyle ayet ayet Kur'an tilaveti (Hafs, murattal). Kaynak: EveryAyah."
en = "Verse-by-verse Quran recitation by Yasser ad-Dussary (Hafs, murattal). Source: EveryAyah."

[pack.license_terms]
tr = [
  "Kayıtların hakları kariye ve kaydın yapımcısına aittir; ses EveryAyah'tan atıfla dağıtılmaktadır.",
  "Yalnızca kişisel, ticari olmayan dinleme içindir.",
  "Hak sahibinin talebi üzerine paket kaldırılır.",
]
en = [
  "The recordings belong to the reciter and the recording's producer; the audio is redistributed from EveryAyah with attribution.",
  "For personal, non-commercial listening only.",
  "The pack is removed on the rights holder's request.",
]

[pack.meta]
reciter = { tr = "Yasir ed-Devseri", en = "Yasser ad-Dussary" }
style = "murattal"
qirat = "hafs"
bitrate = 64
source = "everyayah"

