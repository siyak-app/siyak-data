[pack]
id = "model.bge-m3"
type = "model"
lang = "mul"
title = { tr = "Anlamsal arama modeli (BGE-M3)", en = "Semantic search model (BGE-M3)" }
author = "Jianlv Chen et al. (BAAI)"
version = "1.0.0"
min_app_version = "0.1.0"
license = "MIT"
attribution = "Model: BGE-M3 (https://huggingface.co/BAAI/bge-m3)"
publish = true

[pack.citation]
title = "M3-Embedding: Multi-Linguality, Multi-Functionality, Multi-Granularity Text Embeddings Through Self-Knowledge Distillation"
author = "Jianlv Chen, Shitao Xiao, Peitian Zhang, Kun Luo, Defu Lian, Zheng Liu"
year = "2024"
url = "https://arxiv.org/abs/2402.03216"

[pack.meta]
embedding_model = "local/bge-m3"
dim = 1024
normalized = true
query_prefix = ""
passage_prefix = ""
pooling = "cls"
max_tokens = 512
