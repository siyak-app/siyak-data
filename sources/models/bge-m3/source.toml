# BGE-M3, a local embedding model of semantic search (app spec §7.4, ADR 0012 in the app).
# See docs/pack-format.md §4.8.

[source]
id = "model.bge-m3"
name = "BGE-M3 (BAAI), ONNX export from the model's repository"
homepage = "https://huggingface.co/BAAI/bge-m3"
license = "MIT"
attribution = "Model: BGE-M3, Jianlv Chen et al., Beijing Academy of Artificial Intelligence (https://huggingface.co/BAAI/bge-m3)"
notes = """
The ONNX export (graph, external weights and one external constant) and the tokenizer
are the ones published in the model's repository, pinned by commit. The repository
states license: mit but has no LICENSE file; the LICENSE of the FlagEmbedding project
(MIT, Copyright (c) 2022 staoxiao), which publishes the model, ships as model/LICENSE.
Only the dense vector is used (CLS token), not the sparse or multi-vector outputs.
"""

