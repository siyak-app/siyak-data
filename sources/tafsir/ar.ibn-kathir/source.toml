[build]
# Settings for pipeline/build_tafsir.py (docs/pack-format.md §4.6).
quranpedia_book = 136
footnotes = "drop"   # editor footnotes of the printed edition (M1c decision K2)
min_coverage = 6231   # verses covered by the pinned dump; validate fails below this
dedupe_unpaged = true   # pieces without a page that repeat paged text are stored once (M1c)

# Edition matter left out, and the author's introduction (stored as kind = "introduction" at 1:1)
# (M1c decisions; evidence in README.md, counts in the coverage report).
[[build.exclude]]
verse = "114:6"
part = "0"
reason = "Editor's introduction, study, manuscripts and plates (volume 0)"
[[build.introduction]]
verse = "114:6"
part = "1"
pages = [5, 100]
reason = "Author's introduction (مقدمة ابن كثير)"

