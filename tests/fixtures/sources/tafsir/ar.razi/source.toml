# Mafātīḥ al-Ghayb (al-Tafsīr al-Kabīr), by Fakhr al-Dīn al-Rāzī (d. 606/1210).
# Text from the Quranpedia.net data dumps (book 352). See README.md in this directory
# and ../quranpedia/README.md for the dump format, terms and update policy.

[source]
id = "ar.razi"
name = "Quranpedia.net: Mafātīḥ al-Ghayb (al-Rāzī)"
homepage = "https://quranpedia.net"
license = "Classical work (public domain); digitization: Quranpedia.net data license (version 2026-10-19)"
attribution = "Source: Quranpedia.net (https://quranpedia.net), dump 2026-10-20"

[source.terms]
# Verbatim from https://quranpedia.net/dumps/LICENSE.md (version 2026-10-19), section "License".
text = """
- Free to use inside apps, websites, bots, and research tools — no attribution required (a visible link to https://quranpedia.net is appreciated).
- Republishing this data — in full or in part — as a downloadable database or dataset requires: (1) crediting Quranpedia.net as the source with a link, and (2) stating this dump's version.
- The content is continuously corrected. Keep any copy current via `https://quranpedia.net/api/v1/changes?since=<version>` — distributing outdated Quranic text is the distributor's responsibility.
- Provided as-is, without warranty; verification remains the user's duty.
"""
url = "https://quranpedia.net/dumps/LICENSE.md"

[[files]]
name = "tafsir-book-352.json.gz"
url = "https://quranpedia.net/dumps/tafsir-book-352.json.gz"
mirror = "https://github.com/siyak/siyak-data/releases/download/sources-quranpedia-2026-10-20/tafsir-book-352.json.gz"
version = "2026-10-20"
sha256 = "a0d36758f15ca1ea7bf8eb6ebb53c048214ac7aa2034d8521a9cd83ce02af609"
note = "Dump 2026-10-20; file built_at 2026-08-10T20:36:03+00:00; 17,981,885 bytes."

[build]
# Settings for pipeline/build_tafsir.py (docs/pack-format.md §4.6).
quranpedia_book = 352
footnotes = "drop"   # editor footnotes of the printed edition (M1c decision K2)
min_coverage = 6236   # verses covered by the pinned dump; validate fails below this
dedupe_unpaged = true   # pieces without a page that repeat paged text are stored once (M1c)

# Edition matter left out, and the author's introduction (stored as kind = "introduction" at 1:1)
# (M1c decisions; evidence in README.md, counts in the coverage report).
[[build.exclude]]
verse = "114:6"
part = "32"
pages = [379, 380]
reason = "Printer's colophon (خاتمة الطبع)"

[pack]
id = "ar.razi"
type = "tafsir"
lang = "ar"
title = { tr = "Râzî Tefsiri: Mefâtîhu'l-Gayb", en = "Mafātīḥ al-Ghayb (al-Rāzī)" }
description = { tr = "Akla dayalı (dirâyet) ve kelâmî tefsir: her pasajı meseleler hâlinde, felsefî ve itikadî tartışmalarla ele alır; çok hacimlidir.", en = "Reason-based (dirāya) and theological: treats each passage as a series of questions of philosophy and doctrine; very large." }
author = "Fakhr al-Dīn al-Rāzī"
version = "1.0.0"
min_app_version = "0.1.0"
license = "Public domain (classical work); Quranpedia.net data license"
attribution = "Source: Quranpedia.net · dump 2026-10-20 (https://quranpedia.net)"
publish = true

[pack.license_terms]
tr = [
  "Eser klasik bir metindir; kamu malıdır.",
